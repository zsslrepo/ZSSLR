# =================================================================
# ZSSLR-AzSL — default configuration (paper-faithful)
# Every script reads this file first; CLI flags can override.
# Target: Azerbaijani Sign Language (AzSLD words200).
# =================================================================

seed: 42

training:
  batch_size: 64                  # paper: B=64
  num_epochs: 100
  learning_rate: 1.0e-4           # paper: AdamW lr=1e-4
  weight_decay: 1.0e-5            # paper: weight_decay=1e-5
  warmup_epochs: 5
  scheduler: cosine               # cosine | step | plateau | none
  gradient_clip: 1.0
  val_every_n_epochs: 5
  save_every_n_epochs: 10
  early_stopping_patience: 15
  mixed_precision: bf16           # no | fp16 | bf16

model:
  embedding_dim: 512              # shared space (paper: 512)
  visual_dim: 1024                # Sapiens video embedding (paper: 1024)
  motion_dim: 512                 # MotionBERT motion embedding (paper: 512)
  temperature_init: 0.07          # paper Eq. (2): fixed τ=0.07
  temperature_learnable: false    # paper treats τ as a fixed hyper-parameter

  visual:
    sapiens:
      model_name: sapiens_1b      # sapiens_0.3b | sapiens_0.6b | sapiens_1b
      pretrained_path: checkpoints/sapiens_1b.pt
      input_size: 1024            # paper: native 1024x1024
      num_frames: 32              # paper: T=32 uniformly sampled frames
      temporal_layers: 1          # paper: 1-layer Temporal Transformer
      temporal_heads: 8           # paper: 8 heads
      freeze: true

    motionbert:
      pretrained_path: checkpoints/motionbert_dstformer.pth
      num_joints: 17              # paper: 17-joint H36M skeleton (MotionBERT)
      embed_dim: 512
      num_layers: 5               # paper: DSTformer depth=5
      joint_mask_ratio: 0.15      # training-only augmentation
      joint_noise_std: 0.02
      freeze: true

  text:
    model_name: language-ml-lab/AzerBert
    max_length: 128
    num_prompt_templates: 5       # Azerbaijani prompt ensemble
    freeze: false                 # only trainable text encoder in the system

data:
  azsld:
    root_dir: data/azsld
    video_dir: data/azsld/videos            # link AzSLD words200 videos here
    skeleton_dir: data/azsld/skeletons      # produced by extract_skeletons.py (17-joint)
    descriptions_file: data/azsld/descriptions.json
    splits_dir: data/azsld/splits
    num_glosses: 200              # AzSLD words200
    num_seen: 150
    num_unseen: 50
    seen_val_fraction: 0.1        # video-disjoint held-out val (early stopping)

  preprocessing:
    num_frames: 32                # must match model.visual.sapiens.num_frames
    spatial_size: 1024            # paper native; lower (e.g. 224) for quick local runs
    sampling: uniform             # uniform | random | consecutive
    # ImageNet normalisation (Sapiens & most ViTs are trained with this)
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std:  [0.229, 0.224, 0.225]

  augmentation:
    rgb:
      color_jitter: 0.2
      random_rotation_deg: 5      # never horizontal flip — would invert sign meaning
    skeleton:
      joint_mask_ratio: 0.15
      joint_noise_std: 0.02

loss:
  type: symmetric_infonce         # paper Eq. (2)
  label_smoothing: 0.0

evaluation:
  topk: [1, 5, 10]
  zero_shot_split: unseen_only    # unseen_only | mixed (GZSL)

logging:
  project_name: zsslr-azsl
  use_wandb: false
  use_tensorboard: false
  log_every_n_steps: 50

hardware:
  num_workers: 8
  pin_memory: true

paths:
  output_dir: outputs
  checkpoint_dir: checkpoints
  figures_dir: outputs/figures
